<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Copier</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M7 20l6-6 4 4 8-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--s1)"/><path d="M7 20l6-6 4 4 8-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Signal Copier</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="accounts">Accounts</button>
    <button data-tab="copy">Copy trading</button>
    <button data-tab="telegram">Telegram</button>
    <button data-tab="activity">Activity</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="top-status" id="topStatus"></div>
</header>

<div id="banner"></div>
<main id="main"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal-wrap" hidden></div>
<div id="tooltip" class="tooltip" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
